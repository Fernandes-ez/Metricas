services:
  db:
    image: postgres:17
    restart: unless-stopped
    # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB vêm do backend/.env
    env_file: backend/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: backend/.env
    environment:
      # o entrypoint monta DATABASE_URL apontando para o host "db"
      DB_HOST: db
    ports:
      - "127.0.0.1:3001:3001"

  # TODO: serviço "frontend" (Next.js) entra aqui.
  # TODO: proxy Caddy (HTTPS, 80/443) entra aqui, na frente de backend e frontend.

volumes:
  pgdata:
